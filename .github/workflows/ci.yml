name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build for production
        run: npm run build

      - name: Check that every explainer page was emitted
        run: |
          set -euo pipefail
          for page in index.html rag/index.html hallucination/index.html verifier/index.html; do
            if [ ! -f "dist/$page" ]; then
              echo "Missing expected build output: dist/$page" >&2
              exit 1
            fi
            echo "Found dist/$page"
          done
