name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main, because that run may be mid-deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build for production
        run: npm run build

      - name: Check that every explainer page was emitted
        run: |
          set -euo pipefail
          for page in index.html rag/index.html hallucination/index.html verifier/index.html; do
            if [ ! -f "dist/$page" ]; then
              echo "Missing expected build output: dist/$page" >&2
              exit 1
            fi
            echo "Found dist/$page"
          done

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to gh-pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Sanity check the build output
        run: |
          set -euo pipefail
          for page in index.html rag/index.html hallucination/index.html verifier/index.html; do
            if [ ! -f "dist/$page" ]; then
              echo "Refusing to deploy, missing dist/$page" >&2
              exit 1
            fi
          done
          if [ ! -d dist/assets ]; then
            echo "Refusing to deploy, missing dist/assets" >&2
            exit 1
          fi

      - name: Publish dist to gh-pages
        run: |
          set -euo pipefail
          git config user.name 'Laela Zorana'
          git config user.email 'zoranalaela9@gmail.com'
          git fetch origin gh-pages:gh-pages
          git worktree add ../site gh-pages
          # --checksum, because every page HTML is the same byte size from build
          # to build and rsync's default size-plus-mtime check silently skips them.
          rsync -a --checksum --delete --exclude '.git' dist/ ../site/
          # GitHub Pages must serve the built files as-is, with no Jekyll pass.
          touch ../site/.nojekyll
          # Every asset each page references has to exist in what we are about to
          # publish, otherwise the live site 404s its own scripts.
          python3 - <<'PY'
          import pathlib, re, sys
          site = pathlib.Path('../site')
          missing = []
          for page in site.rglob('*.html'):
              for ref in re.findall(r'(?:src|href)="((?!data:|https?:|#)[^"]+)"', page.read_text()):
                  target = (page.parent / ref).resolve()
                  if not target.exists():
                      missing.append(f'{page.relative_to(site)} references missing {ref}')
          if missing:
              print('\n'.join(missing), file=sys.stderr)
              sys.exit(1)
          print('Every referenced asset is present.')
          PY
          cd ../site
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already matches this build, nothing to publish."
            exit 0
          fi
          git commit -m "Deploy: build of ${GITHUB_SHA}"
          git push origin gh-pages
